apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eureka-static-ingress
  namespace: skillsync
  annotations:
    # Paths like /eureka/css(/|$)(.*) are longer than the main ingress
    # path /eureka(/|$)(.*) (16 chars), so nginx sorts them first and
    # they win. The rewrite reconstructs the full path for Eureka.
    nginx.ingress.kubernetes.io/rewrite-target: /eureka/$1$2$3
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /eureka/(css)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: eureka-server
                port:
                  number: 8761
          - path: /eureka/(js)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: eureka-server
                port:
                  number: 8761
          - path: /eureka/(fonts)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: eureka-server
                port:
                  number: 8761
