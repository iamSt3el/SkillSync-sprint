apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skillsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asia-south1-docker.pkg.dev/project-00909acc-d419-4f02-8a1/skillsync-repo/api-gateway:latest
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: skillsync-config
          env:
            - name: SPRING_APPLICATION_NAME
              value: "api-gateway"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skillsync
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 9090
  type: LoadBalancer    # public-facing — gets an external IP
