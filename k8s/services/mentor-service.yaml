apiVersion: apps/v1
kind: Deployment
metadata:
  name: mentor-service
  namespace: skillsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mentor-service
  template:
    metadata:
      labels:
        app: mentor-service
    spec:
      containers:
        - name: mentor-service
          image: asia-south1-docker.pkg.dev/project-00909acc-d419-4f02-8a1/skillsync-repo/mentor-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: skillsync-config
          env:
            - name: SPRING_APPLICATION_NAME
              value: "mentor-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/mentor_service"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillsync-secrets
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: mentor-service
  namespace: skillsync
spec:
  selector:
    app: mentor-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
