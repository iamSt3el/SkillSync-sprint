apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: skillsync
spec:
  replicas: 1
  # Recreate avoids running two SonarQube/Elasticsearch instances at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      initContainers:
        # Elasticsearch (bundled inside SonarQube) requires vm.max_map_count >= 524288.
        # GKE nodes default to 65530, so we raise it here before SonarQube starts.
        - name: init-sysctl
          image: busybox
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=524288 && sysctl -w fs.file-max=131072']
          securityContext:
            privileged: true
      containers:
        - name: sonarqube
          # 9.9 LTS — last version with the embedded H2 database (evaluation/demo use).
          # For production, switch to PostgreSQL and use sonarqube:community.
          image: sonarqube:9.9-community
          ports:
            - containerPort: 9000
          env:
            - name: SONAR_WEB_CONTEXT
              value: "/sonarqube"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_SEARCH_JAVAOPTS
              value: "-Xmx512m -Xms512m"
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /sonarqube/api/system/status
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /sonarqube/api/system/status
              port: 9000
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: skillsync
spec:
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
  type: ClusterIP
